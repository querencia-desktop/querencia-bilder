[package]
name = "querencia-bilder"
version = "0.2.3"
edition = "2024"
rust-version = "1.92"
description = "Querencia Bilder: klassischer Bildbetrachter für Querencia Desktop (Prototyp)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Dieselben Bindings wie die übrigen Querencia-Programme (gtk-rs 0.11).
# Dekodiert wird mit dem System-gdk-pixbuf (Ubuntu 26.04: glycin-Lader für
# PNG, JPEG, GIF, BMP, WebP, AVIF, …); Querencia Bilder schreibt nie Bilder.
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gdk-pixbuf = "0.22"
# Übersetzungen über GNU gettext (po/, .mo unter share/locale). Feature
# gettext-system: das gettext der glibc statt eines mitgebauten libintl.
gettext-rs = { version = "0.8", features = ["gettext-system"] }

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
